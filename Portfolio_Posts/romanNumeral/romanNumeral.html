<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="icon" type="image/png" href="images/Achilles_no_bckgrnd.png">
        <title>Roman Numeral Converter</title>
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <main class="container">
          <img class="achilles" src="images/Achilles_no_bckgrnd.png" alt="Achilles - is he Roman? Hell, I don't know. Close enough.">
          <h1 class="title">Roman Numeral Converter</h1>
          <div class="converter">
            <form id="numeral-form">
              <label for="number">Enter a number:
              </label>
              <input class="numeral-input" id="number" type="number">
              <button class="numeral-btn" id="convert-btn" type="button">Convert</button>

            </form>
            <div class="output hidden" id="output"></div>
          </div>
        </main>
        <script src="romanNumeral.js"></script>
    </body>
</html>
